<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870"><style>text{font-family:Arial,sans-serif;fill:#dce7ee} .box{fill:#172a38;stroke:#668092;stroke-width:1.5}</style><rect width="1200" height="870" fill="#101d28"/><text x="45" y="43" font-size="27">Power and data · approved facade edition</text><text x="45" y="76" font-size="14">Independent 12 V PSU positives. Fuses protect actual conductors; final cable sizing and fuse approval required.</text><rect x="45" y="103" width="1110" height="66" class="box"/><text x="64" y="131" font-size="19">One shared soundtrack/timeline → Ethernet switch → three controllers</text><text x="64" y="155" font-size="14">WLT2 bank files preserve native PTS; an FSEQ adapter and physical latency verification remain required.</text><rect x="45" y="199" width="310" height="130" class="box"/><rect x="400" y="199" width="310" height="130" class="box"/><rect x="755" y="199" width="400" height="130" class="box"/><text x="62" y="226" font-size="20">A: controller + 320.4 W PSU</text><text x="62" y="253" font-size="15">6 ports · channels 1–1104</text><text x="62" y="280" font-size="15">368 addresses / 264.96 W max</text><text x="62" y="306" font-size="14">DDP receive offset 0 · data + GND</text><text x="417" y="227" font-size="20">9 fused injection branches</text><text x="417" y="254" font-size="15">Pixel load 22.08 A at 12 V</text><text x="417" y="281" font-size="15">Rated ≥30 A distribution bus</text><text x="417" y="307" font-size="14">V+ isolated at section boundaries</text><text x="773" y="227" font-size="20">A props</text><text x="773" y="256" font-size="14">Arch1 · Arch2 · Star1 · Pole1</text><text x="773" y="281" font-size="14">Pole2 · StripWC</text><text x="773" y="307" font-size="14">Detailed endpoints: power-feeds.csv</text><path d="M355 259 H400 M710 259 H755" stroke="#edab63" stroke-width="4" fill="none"/><rect x="45" y="367" width="310" height="130" class="box"/><rect x="400" y="367" width="310" height="130" class="box"/><rect x="755" y="367" width="400" height="130" class="box"/><text x="62" y="394" font-size="20">B: controller + 320.4 W PSU</text><text x="62" y="421" font-size="15">5 ports · channels 1105–2124</text><text x="62" y="448" font-size="15">340 addresses / 244.80 W max</text><text x="62" y="474" font-size="14">DDP receive offset 0 · data + GND</text><text x="417" y="395" font-size="20">8 fused injection branches</text><text x="417" y="422" font-size="15">Pixel load 20.40 A at 12 V</text><text x="417" y="449" font-size="15">Rated ≥30 A distribution bus</text><text x="417" y="475" font-size="14">V+ isolated at section boundaries</text><text x="773" y="395" font-size="20">B props</text><text x="773" y="424" font-size="14">Arch3 · Arch4 · Star2 · Pole3</text><text x="773" y="449" font-size="14">Pole4</text><text x="773" y="475" font-size="14">Detailed endpoints: power-feeds.csv</text><path d="M355 427 H400 M710 427 H755" stroke="#85b8fb" stroke-width="4" fill="none"/><rect x="45" y="535" width="310" height="130" class="box"/><rect x="400" y="535" width="310" height="130" class="box"/><rect x="755" y="535" width="400" height="130" class="box"/><text x="62" y="562" font-size="20">C: controller + 320.4 W PSU</text><text x="62" y="589" font-size="15">8 ports · channels 2125–2862</text><text x="62" y="616" font-size="15">246 addresses / 177.12 W max</text><text x="62" y="642" font-size="14">DDP receive offset 0 · data + GND</text><text x="417" y="563" font-size="20">10 fused injection branches</text><text x="417" y="590" font-size="15">Pixel load 14.76 A at 12 V</text><text x="417" y="617" font-size="15">Rated ≥30 A distribution bus</text><text x="417" y="643" font-size="14">V+ isolated at section boundaries</text><text x="773" y="563" font-size="20">C props</text><text x="773" y="592" font-size="14">Pole5 · Pole6 · Pole7 · Pole8</text><text x="773" y="617" font-size="14">Pole9 · Pole10 · StripKitchen · StripDoor</text><text x="773" y="643" font-size="14">Detailed endpoints: power-feeds.csv</text><path d="M355 595 H400 M710 595 H755" stroke="#9bd6bd" stroke-width="4" fill="none"/><text x="45" y="749" font-size="16">Feed split: 12 × 50-node arch/star · 10 × 20-node pole · 28 / 32 / 32 / 31 / 31 strip groups</text><text x="45" y="780" font-size="14">Provisional fuses: bullets 4 A · poles 1.5 A · strips 2.5 A. No controller V+ bypass of injection protection.</text><text x="45" y="811" font-size="14">Facade cables rise on the right, then route at y=2.55 m above the door lintel. Threshold and paving stay clear.</text><text x="45" y="842" font-size="14">Design maximum 686.88 W, excluding overhead/losses; requires strip ≤7.2 W/m at 10 addresses/m.</text></svg>