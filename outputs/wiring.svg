<rect x="925" y="365" width="225" height="102" class="box"/><text x="943" y="393" class="label">350 outdoor pixels</text><text x="943" y="421" class="small">V+ isolated between sections</text><text x="943" y="447" class="small">Same-bank reference ground</text>
