<rect x="925" y="500" width="225" height="102" class="box"/><text x="943" y="528" class="label">350 outdoor pixels</text><text x="943" y="556" class="small">V+ isolated between sections</text><text x="943" y="582" class="small">Same-bank reference ground</text>
