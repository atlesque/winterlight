<path d="M320 580 H345 V617 H1040 V602" class="net"/><text x="40" y="680" class="small">*Fuse selection must protect every downstream wire/connector; confirm ratings, curves and ambient derating.</text>
<text x="40" y="707" class="small">Orange = fused12V power • Blue = Ethernet / pixel data • Green = protected mains route (schematic)</text>
<text x="40" y="734" class="small">Never parallel PSU positives. Only50-node sections on the same bank share return. No pixel current through Ethernet.</text>
<text x="40" y="761" class="small">21 protected sections total. IP68 nodes do not waterproof plugs, cuts or boxes. Software dimming is supplementary.</text></svg>