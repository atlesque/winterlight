<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790"><style>text{font-family:Arial,sans-serif;fill:#172c3a} .title{font-size:28px;font-weight:bold} .label{font-size:17px} .small{font-size:14px} .box{fill:#f0f5f7;stroke:#536e7d;stroke-width:2} .dc{stroke:#d45435;stroke-width:3;fill:none} .net{stroke:#287ac0;stroke-width:3;fill:none} .ground{stroke:#359868;stroke-width:3;fill:none}</style><rect width="1200" height="790" fill="white"/><text x="40" y="48" class="title">Power and control • three independent 350-pixel banks</text>
<text x="40" y="78" class="small">Planning diagram. Mains assembly / site protection require a qualified electrician.</text>
<rect x="40" y="110" width="315" height="83" class="box"/><text x="58" y="140" class="label">xLights → FSEQ + exact audio</text><text x="58" y="170" class="small">One FPP player → wired audio speaker</text>
<rect x="440" y="110" width="235" height="83" class="box"/><text x="465" y="142" class="label">Ethernet switch</text><text x="465" y="171" class="small">DDP realtime frames,40fps</text>
<path d="M355 151 H440" class="net"/>
<rect x="740" y="110" width="410" height="83" class="box"/><text x="760" y="140" class="label">Verified230V circuit / isolation</text><text x="760" y="170" class="small">Suitable30mA RCD; protected earth/mains</text><rect x="40" y="230" width="280" height="102" class="box"/><text x="56" y="258" class="label">A: Ethernet controller</text><text x="56" y="284" class="small">Data + GND → props; short data leads</text><text x="56" y="311" class="small">4 data outputs used</text>
<rect x="365" y="230" width="255" height="102" class="box"/><text x="383" y="258" class="label">A:12V PSU /320W</text><text x="383" y="285" class="small">350 nodes:21A /252W + overhead</text><text x="383" y="312" class="small">Dry, ventilated, protected terminals</text>
<rect x="665" y="230" width="215" height="102" class="box"/><text x="682" y="258" class="label">7 fused DC branches</text><text x="682" y="286" class="small">One50-node section each</text><text x="682" y="312" class="small">3A load;4A fuse* per section</text>
<rect x="925" y="230" width="225" height="102" class="box"/><text x="943" y="258" class="label">350 outdoor pixels</text><text x="943" y="286" class="small">V+ isolated between sections</text><text x="943" y="312" class="small">Same-bank reference ground</text>
